[workspace]
resolver = "2"
members = []

# The framework has no Rust crates: every component is a Clean Language
# plugin under plugins/ (source in src/main.cln, compiled to plugin.wasm).
# This manifest only carries the framework release version, which the
# release tags (vX.Y.Z) follow. The server runtime lives in
# https://github.com/Ivan-Pasco/clean-server-old.

[workspace.package]
version = "2.12.202"
edition = "2021"
authors = ["Ivan Pasco"]
license = "MIT"
repository = "https://github.com/Ivan-Pasco/cleen-framework-old"
homepage = "https://www.cleanlanguage.dev"
