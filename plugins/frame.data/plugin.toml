[plugin]
name = "frame.data"
version = "3.0.18"
description = "ORM and database plugin for Clean Language: data models with save/delete/migrate, the query DSL (find, first, findOrFail, count, exists, paginate, cursor), transactions, migrations and raw SQL."
author = "Clean Language Team"
license = "MIT"

[compatibility]
# Amendment 13 (§3.18 `_emit_capability`) required — the plugin emits
# `can Persist:` from emit_module_helpers_typed as of v2.1.5 (2026-07-19).
# 0.33.100 is the compiler cycle in which Amendment 13 landed. Am 10
# (`_emit_class_methods_from_spec`, needed for template-generator method
# emission) is transitively covered by 0.33.100 ≥ 0.30.423.
min_compiler_version = "0.33.100"
# Plugin Contracts v2 — runtime-abi.md §4. ABI version stamped into WASM at
# compile time; loader verifies it when present.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1.
# Atomic migration: this plugin.wasm will be v3-only once Sub-cycle 5 lands.
# emission_ops_hash verified against SHA-256 of
# foundation/spec/plugins/contracts/typed-emission-ops.toml at compiler 0.30.423.
# Same hash as frame.canvas v3.0.0 (both stamped against the same ops table).
expansion_version = "3.0.0"
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

[lifecycle]
# typed-emission.md §7: emit_module_helpers_typed emits `can Persist:` and
# `class Database` (DAT-S000, DAT-S011). Connection setup and migration
# auto-apply live in clean-server, so the server-init slot emits nothing.
module_helpers_are_roots = true
module_helpers = "emit_module_helpers_typed"
server_init = "emit_server_init_typed"

[exports]
# v3 typed entry point — typed-emission.md §2.2.
expand = "expand_block_typed"
validate = "validate_block"
get_keywords = "get_keywords"
# Contract 5 Phase C — cross-file lint hook. Emits FRAME-DATA-I002 and
# FRAME-DATA-E026 by walking the pre-expansion AST via _ast_* accessors.
# Spec: foundation/spec/framework/contracts/lint-extension.md §2.
lint = "lint_project"

[handles]
# Model definitions and migration definitions
blocks = ["data", "migrate"]

# Expression-level blocks routed to expand_block_typed. The removed v1
# mutation verbs (insert, insert_id, update, upsert, delete) stay listed so
# the plugin answers them with FRAME-DATA-E021 and the v2 replacement.
#
# This key MUST stay before any [blocks.*] or [bridge] table, otherwise TOML
# scopes it under that table.
expressions = [
  "*.find:",
  "*.first:",
  "*.findOrFail:",
  "*.count:",
  "*.exists:",
  "*.select:",
  "*.insert:",
  "*.insert_id:",
  "*.update:",
  "*.upsert:",
  "*.delete:",
  "*.migrate",
  "*.paginate:",
  "*.cursor:",
  "transaction:",
  "db.query:",
  "db.queryAs"
]

# Per-block typed-emission declarations (typed-emission.md §2.1).
# version = 3 is required when expansion_version = "3.0.0".
[blocks.data]
expand = "expand_block_typed"
version = 3

[blocks.migrate]
expand = "expand_block_typed"
version = 3

# Bridge function declarations - these are provided by the runtime (clean-server)
# The compiler reads these to generate correct WASM imports
[bridge]
# Database functions provided by clean-server host bridge
functions = [
  # Query and Execute - strings passed as (ptr, len) pairs at WASM level
  { name = "_db_query", params = ["string", "string"], returns = "string", description = "Execute SELECT query, returns JSON result with rows", expand_strings = true, hosts = ["server"] },
  { name = "_db_execute", params = ["string", "string"], returns = "i32", description = "Execute INSERT/UPDATE/DELETE, returns affected row count", expand_strings = true, hosts = ["server"] },

  # Current Unix timestamp for `now()` / `time.now()`, so projects that load
  # frame.data without frame.server still have a timestamp source. Same bridge
  # as frame.server's declaration.
  { name = "_time_now", params = [], returns = "i64", description = "Current Unix timestamp in seconds since epoch.", hosts = ["all"] },

  # Random bytes as lowercase hex for generated UUID primary keys
  # (`uuid id primary generated`, DAT-E002). Same bridge as frame.auth's
  # declaration.
  { name = "_crypto_random_hex", params = ["i32"], returns = "ptr", description = "Generate random hex string of specified byte length", hosts = ["all"] },

  # Transactions
  { name = "_db_begin", params = [], returns = "i32", description = "Begin a database transaction; returns 1 on success, 0 on error", hosts = ["server"] },
  { name = "_db_commit", params = [], returns = "i32", description = "Commit the current database transaction; returns 1 on success, 0 on error", hosts = ["server"] },
  { name = "_db_rollback", params = [], returns = "i32", description = "Rollback the current database transaction; returns 1 on success, 0 on error", hosts = ["server"] },

  # Connection pool configuration (called by the host bootstrap).
  # Parameter: JSON object with keys: engine, host, port, database, user, password, pool_max, pool_idle_timeout_ms
  { name = "_db_configure", params = ["string"], returns = "i32", description = "Configure the database connection pool from JSON config object; returns 0 on success, -1 on error", expand_strings = true, hosts = ["server"] },

  # Migration System
  # Register a named migration for version tracking; the runtime records it in the
  # schema_migrations table with a pending status until it is applied.
  { name = "_db_register_migration", params = ["string", "string", "string"], returns = "i32", description = "Register a migration (name, up_sql, down_sql) for version tracking; the runtime executes up_sql before first request if not already applied; returns 1 on success, 0 on error", expand_strings = true, hosts = ["server"] },

  # Compare the declared field definitions for a table against the live database
  # schema and return the ALTER TABLE SQL needed to reconcile the difference.
  # Returns an empty string when the schema already matches the declaration.
  { name = "_db_migration_diff", params = ["string", "string"], returns = "string", description = "Compare declared model fields against the live database table schema; returns ALTER TABLE SQL or empty string when in sync", expand_strings = true, hosts = ["server"] },

  # Execute all pending registered migrations in version order.
  { name = "_db_run_migrations", params = [], returns = "i32", description = "Run all pending registered migrations in version order; returns count of migrations applied", hosts = ["server"] },

  # Roll back a specific named migration by executing its down function.
  { name = "_db_rollback_migration", params = ["string"], returns = "i32", description = "Rollback a specific migration by name; returns 0 on success, -1 on error", expand_strings = true, hosts = ["server"] },

  # Return a JSON array describing every known migration and its current status.
  # Each element has the shape: {"name":"...","applied_at":"..."|null}.
  { name = "_db_migration_status", params = [], returns = "string", description = "Get JSON array of migration status records (name, applied_at); applied_at is null for pending migrations", hosts = ["server"] },

  # Pagination helpers — called by plugin-generated code, never directly by application code
  { name = "_db_paginate", params = ["string", "string", "i64", "i64"], returns = "string", description = "Offset-based paginated query: model table name, where JSON, page number (1-based), records per page. Returns PagedResult JSON.", expand_strings = true, hosts = ["server"] },
  { name = "_db_cursor_page", params = ["string", "string", "i64", "string", "string"], returns = "string", description = "Cursor-based paginated query: model table name, where JSON, records per page, after-cursor value, cursor field name. Returns CursorResult JSON.", expand_strings = true, hosts = ["server"] },

  # Field validation helper — validates a runtime-supplied column name against the model schema
  { name = "_db_valid_field", params = ["string", "string"], returns = "boolean", description = "Return true when the second argument is a valid column name for the table named in the first argument; used for runtime order-by safety checks.", expand_strings = true, hosts = ["server"] },
]

[language]
# Block-level keywords that start a declaration
blocks = ["data", "migrate"]

# Keywords used within plugin context (frame-data.ebnf)
keywords = [
  { name = "table", description = "Table name of a data model (DAT-M018)", context = "block" },
  { name = "fields", description = "Persisted fields of a data model: `<type> <name> [primary] [generated] [required] [unique] [default: v] [as \"column\"]` (DAT-M015)", context = "block" },
  { name = "indexes", description = "Indexes of a data model: `field`, `(a, b)`, optional `unique` (DAT-M019)", context = "block" },
  { name = "relations", description = "Relations: `<name>: has_many|has_one|belongs_to <Model> on <fk>` (DAT-M020)", context = "block" },
  { name = "queries", description = "Query methods of a data model, called as `<entity>.data.<method>()` (DAT-A006)", context = "block" },
  { name = "find", description = "Query records from a model; returns list<Model>", context = "expression" },
  { name = "first", description = "First matching record; returns Model? (null when none)", context = "expression" },
  { name = "findOrFail", description = "First matching record; raises NOT_FOUND when none", context = "expression" },
  { name = "count", description = "Count matching records; returns integer", context = "expression" },
  { name = "exists", description = "Whether any record matches; returns boolean", context = "expression" },
  { name = "paginate", description = "Offset pagination; returns PagedResult<Model>", context = "expression" },
  { name = "cursor", description = "Cursor pagination; returns CursorResult<Model>", context = "expression" },
  { name = "migrate", description = "Create a model's table (`Model.migrate()`) or declare a versioned migration (`migrate \"name\":`)", context = "both" },
  { name = "where", description = "Filter conditions, one per line, AND-ed", context = "block" },
  { name = "order", description = "Sort: `order: field [asc|desc]`", context = "block" },
  { name = "limit", description = "Maximum number of results", context = "block" },
  { name = "offset", description = "Number of results to skip", context = "block" },
  { name = "include", description = "Eager-load related models (LEFT JOIN)", context = "block" },
  { name = "join", description = "Join a model under an alias: `Model as alias [left|right]:` + `on:`", context = "block" },
  { name = "link", description = "Many-to-many traversal through a junction model", context = "block" },
  { name = "group", description = "Group results by field", context = "block" },
  { name = "having", description = "Filter grouped results", context = "block" },
  { name = "select", description = "Fetch only the listed columns", context = "block" },
  { name = "up", description = "SQL applied when running the migration forward", context = "block" },
  { name = "down", description = "SQL applied when rolling the migration back", context = "block" },
]

# Custom types provided by the plugin
types = [
  { name = "Model", description = "Base type for data models" },
  { name = "Query", description = "Database query builder" },
  { name = "Transaction", description = "Database transaction context" },
  { name = "datetime", description = "Database datetime/timestamp field type — serialized as ISO string in JSON responses" },
  { name = "PagedResult", instance_class = "PagedResult_{T}", description = "Paginated query result. PagedResult<Model> is shorthand for the class PagedResult_<Model> that frame.data emits for every data model — fields: items list<Model>, totalCount integer, totalPages integer, currentPage integer, perPage integer, hasNext boolean, hasPrev boolean" },
  { name = "CursorResult", instance_class = "CursorResult_{T}", description = "Cursor-based paginated result. CursorResult<Model> is shorthand for the class CursorResult_<Model> that frame.data emits for every data model — fields: items list<Model>, nextCursor string, hasNext boolean, hasPrev boolean, count integer" },
]

# Built-in functions/expressions
functions = [
  { name = "transaction", signature = "transaction: block", description = "Run the block in one database transaction; any error rolls it back (DAT-T002). Transactions cannot be nested (DAT-T003)." },
  { name = "db.query", signature = "db.query(sql, params)", description = "Execute raw SQL with a JSON params array; returns the JSON result object", maps_to = "_db_query", params = ["string", "string"], returns = "string" },
  { name = "db.queryAs", signature = "db.queryAs(Model):\n\tsql: \"...\"\n\tparams: [...]", description = "Execute raw SQL and map the rows to list<Model>" },
  { name = "db.execute", signature = "db.execute(sql, params)", description = "Execute INSERT/UPDATE/DELETE; returns affected row count or -1 on error", maps_to = "_db_execute", params = ["string", "string"], returns = "integer" },
  { name = "db.begin", signature = "db.begin()", description = "Begin a database transaction; returns false on failure", maps_to = "_db_begin", params = [], returns = "boolean" },
  { name = "db.commit", signature = "db.commit()", description = "Commit the current database transaction; returns false on failure", maps_to = "_db_commit", params = [], returns = "boolean" },
  { name = "db.rollback", signature = "db.rollback()", description = "Roll back the current database transaction; returns false on failure", maps_to = "_db_rollback", params = [], returns = "boolean" },
  { name = "Database.save", signature = "Database.save(entity)", description = "Insert the entity when its id is unset (then set id), update it otherwise (DAT-S001)" },
  { name = "Database.delete", signature = "Database.delete(entity)", description = "Delete the entity's row; no error when it is already gone (DAT-S003)" },
  { name = "Database.deleteOrFail", signature = "Database.deleteOrFail(entity)", description = "Delete the entity's row; raises NOT_FOUND when no row matched (DAT-S004)" },
  { name = "Database.saveAll", signature = "Database.saveAll(entities)", description = "Save every entity of the list; returns how many were saved (DAT-S005)" },
  { name = "Database.deleteAll", signature = "Database.deleteAll(entities)", description = "Delete every entity of the list; returns how many rows were removed (DAT-S006)" },
  { name = "Model.find", signature = "Model.find:\n\twhere:\n\t\tcondition", description = "Query records with optional where, order, limit, offset, select, join, link, include, group, having clauses; returns list<Model>" },
  { name = "Model.first", signature = "Model.first:\n\twhere:\n\t\tcondition", description = "First matching record or null" },
  { name = "Model.findOrFail", signature = "Model.findOrFail:\n\twhere:\n\t\tcondition", description = "First matching record; raises NOT_FOUND when none" },
  { name = "Model.count", signature = "Model.count:\n\twhere:\n\t\tcondition", description = "Count matching records" },
  { name = "Model.exists", signature = "Model.exists:\n\twhere:\n\t\tcondition", description = "Whether any record matches (boolean)" },
  { name = "Model.paginate", signature = "Model.paginate:\n\twhere:\n\t\tcondition\n\tpaginate:\n\t\tpage: 1\n\t\tperPage: 20", description = "Offset-based paginated query returning PagedResult<Model> with items, totalCount, totalPages, currentPage, perPage, hasNext, hasPrev" },
  { name = "Model.cursor", signature = "Model.cursor:\n\twhere:\n\t\tcondition\n\tcursor:\n\t\tafter: \"\"\n\t\tperPage: 20\n\t\tby: id", description = "Cursor-based paginated query returning CursorResult<Model> with items, nextCursor, hasNext, hasPrev, count" },
  { name = "Model.migrate", signature = "Model.migrate()", description = "Create the model's table and indexes if they do not exist (DAT-C005)" },
  { name = "migrate", signature = "migrate \"name\":\n\tup:\n\t\t\"SQL\"\n\tdown:\n\t\t\"SQL\"", description = "Define a versioned schema migration (DAT-C006, DAT-C007)" },
  { name = "tenant_getId", signature = "tenant_getId()", description = "Current tenant ID from the session (frame.auth); tenant-scoped models filter every query by it (DAT-I001)" },
  { name = "db.paginate", signature = "db.paginate(tableName, whereJson, page, perPage)", description = "Low-level offset pagination bridge; prefer Model.paginate: block", maps_to = "_db_paginate", params = ["string", "string", "integer", "integer"], returns = "string" },
  { name = "db.cursorPage", signature = "db.cursorPage(tableName, whereJson, perPage, after, byField)", description = "Low-level cursor pagination bridge; prefer Model.cursor: block", maps_to = "_db_cursor_page", params = ["string", "string", "integer", "string", "string"], returns = "string" },
  { name = "time.now", signature = "time.now()", description = "Current Unix timestamp in seconds since epoch", maps_to = "_time_now", params = [], returns = "integer" },
  { name = "now", signature = "now()", description = "Alias for time.now() — current Unix timestamp in seconds", maps_to = "_time_now", params = [], returns = "integer" },
]

# Auto-completion suggestions
completions = [
  { trigger = "data ", insert = "data ${1:ModelName}:\n\tfields:\n\t\t${2:string} ${3:name} required" },
  { trigger = ".find:", insert = "find:\n\twhere:\n\t\t${1:condition}" },
  { trigger = ".first:", insert = "first:\n\twhere:\n\t\t${1:condition}" },
  { trigger = ".exists:", insert = "exists:\n\twhere:\n\t\t${1:condition}" },
  { trigger = ".findOrFail:", insert = "findOrFail:\n\twhere:\n\t\t${1:condition}" },
  { trigger = "transaction:", insert = "transaction:\n\t${1:// transaction code}" },
  { trigger = "migrate ", insert = "migrate \"${1:001_migration_name}\":\n\tup:\n\t\t\"${2:CREATE TABLE ...}\"\n\tdown:\n\t\t\"${3:DROP TABLE ...}\"" },
  { trigger = ".paginate:", insert = "paginate:\n\twhere:\n\t\t${1:condition}\n\tpaginate:\n\t\tpage: ${2:1}\n\t\tperPage: ${3:20}" },
  { trigger = ".cursor:", insert = "cursor:\n\twhere:\n\t\t${1:condition}\n\tcursor:\n\t\tafter: ${2:\"\"}\n\t\tperPage: ${3:20}\n\t\tby: ${4:id}" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/data", "app/data/models", "app/data/queries", "app/data/migrations", "app/data/repositories", "app/data/seeds"]

# Automatically create folders when plugin is imported
auto_create = true

# File patterns recognized in owned folders
patterns = ["*.cln", "*.sql"]

# Files in owned folders automatically import this plugin
implicit_import = true

[enforcement]
severity = "warn"

restricted_functions = [
  { name = "_db_query", use_instead = "Model.find: or db.query:", message = "Use ORM query blocks instead of raw _db_query()" },
  { name = "_db_execute", use_instead = "Database.save / Database.delete", message = "Use Database.save / Database.delete instead of raw _db_execute()" },
]

required_blocks = [
  { folder = "app/data/models/", block = "data", message = "Model files should contain 'data ModelName' definitions" },
  { folder = "app/data/migrations/", block = "migrate", message = "Migration files should contain 'migrate \"name\":' definitions" },
]

block_folder_rules = [
  { block = "data", allowed_in = ["app/data/", "app/backend/", "app/server/"], message = "data models should be in app/data/ or app/backend/" },
  { block = "migrate", allowed_in = ["app/data/migrations/"], message = "migrate blocks must be in app/data/migrations/" },
]

[ai]
description = "ORM and database plugin. Read with the query DSL (Model.find:, first:, findOrFail:, count:, exists:, paginate:, cursor:) or an entity's queries: methods; write with Database.save / Database.delete. Reserve db.query/db.queryAs for queries the DSL cannot express. Never call _db_query or _db_execute directly."
constraints = [
  "Always use the query DSL and Database.save/delete — never call _db_query or _db_execute directly",
  "data model files belong in app/data/models/, migrations in app/data/migrations/",
  "Every multi-step mutation must be wrapped in transaction: to ensure atomicity",
  "In a multi-tenant app give every model a tenantId field — frame.data then scopes every query, update and delete to tenant_getId()",
]

[[ai.patterns]]
name = "multilingual-site"
use_when = "app serves content in more than one language"
anti_pattern = "storing translations as a JSON column on the content row — prevents SQL-level filtering by locale, cannot be indexed, breaks FK integrity, and forces app-side deserialization on every read"
example = "patterns/multilingual-site.cln"

[[ai.patterns]]
name = "cms-page-content"
use_when = "a website serves the same pages in multiple languages and content is managed as a flat key-value table (Page × Language × field_key)"
anti_pattern = "storing all page content in a JSON blob per language — cannot be queried field-by-field, has no FK integrity, makes translation completeness checks impossible without parsing every row. Also: never use dot notation in field keys, never hardcode user-visible strings in Clean code"
example = "patterns/cms-page-content.cln"

[[ai.patterns]]
name = "soft-delete"
use_when = "records must be deactivatable without permanent removal (compliance, undo, audit trails)"
anti_pattern = "boolean is_deleted column — loses the deletion timestamp; use deleted_at: datetime nullable instead so you always know WHEN it was deleted"
example = "patterns/soft-delete.cln"

[[ai.patterns]]
name = "audit-log"
use_when = "every state change on a record must be traceable for compliance, debugging, or undo"
anti_pattern = "overwriting rows in place — history is lost; use an append-only *_events or *_log table where you only INSERT, never UPDATE or DELETE"
example = "patterns/audit-log.cln"

[[ai.patterns]]
name = "multi-tenant"
use_when = "one database instance serves multiple isolated customer organisations"
anti_pattern = "no tenant scoping — one tenant can read another's data; every model needs a tenant_id FK and every query must filter by it using tenant_getId()"
example = "patterns/multi-tenant.cln"

[[ai.patterns]]
name = "pagination"
use_when = "endpoint returns a list that can grow — use paginate: for page-number UI, cursor: for infinite scroll or large tables"
anti_pattern = "manually calculating offset: (page-1)*limit and running a separate count: query — use paginate: which does both in one round trip; use cursor: for tables that will exceed ~1M rows"
example = "patterns/pagination.cln"

[[ai.patterns]]
name = "tree-structure"
use_when = "data has a parent-child hierarchy: categories, menus, org charts, comment threads"
anti_pattern = "recursive self-joins at query time for deep trees — use parent_id for shallow trees (≤3 levels); for deep trees use a closure table (separate ancestor/descendant pairs table)"
example = "patterns/tree-structure.cln"

[[ai.patterns]]
name = "atomic-transaction"
use_when = "a business operation writes to more than one row or table and must either fully succeed or fully roll back (transfer between accounts, order + line items, user + profile creation)"
anti_pattern = "issuing the writes as separate top-level Model.insert / Model.update statements — if a later write fails, earlier writes are already committed and the database is left in an inconsistent state. Wrap the whole sequence in a transaction: block; any error inside the block triggers automatic rollback."
example = "patterns/atomic-transaction.cln"



[build]
built_with_compiler = "0.33.175"