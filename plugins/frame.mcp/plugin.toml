[plugin]
name = "frame.mcp"
version = "2.0.1"
description = "MCP server plugin — define AI-callable tools, resources, and prompts inside mcp: blocks. Handles the full MCP lifecycle: capability negotiation, JSON-RPC 2.0 dispatch (__mcp_handle), param validation and deserialization, and stdio/HTTP transports. Typed emission (plugin contracts v3): generated helpers are composed with _emit_stmt_from_source + batch.func2; user handler bodies pass through _emit_stmt_from_source. See foundation/spec/framework/contracts/typed-emission.md."
author = "Clean Language Team"
license = "MIT"

[compatibility]
# Landing C4 floor: sticky-error context (§3.15) available.
min_compiler_version = "0.30.417"
# Plugin Contracts v2 — runtime-abi.md §4. ABI version stamped into WASM at
# compile time when built with --target=plugin; loader verifies it when present.
abi_version = "1.0.0"
# Plugin Contracts v3 — typed-emission.md §2.1.
# Atomic migration: this plugin.wasm is v3-only. No v1 exports are present.
# emission_ops_hash verified against SHA-256 of
# foundation/spec/framework/contracts/typed-emission-ops.toml at compiler 0.30.417.
expansion_version = "3.0.0"
emission_ops_hash = "60d06836a7068ee66a330e8c26ca59bc47cc44991b4f31d56e95e06c707eeaf0"

[lifecycle]
# Plugin Contracts v3 — typed-emission.md §7. All three slots MUST be typed
# variants under atomic-migration. frame.mcp emits its helpers, handlers,
# dispatcher and transport loop from expand_block_typed, so these slots
# contribute nothing and return 0.
module_helpers_are_roots = true
module_helpers = "emit_module_helpers_typed"
server_init = "emit_server_init_typed"
per_request = "emit_per_request_typed"

[exports]
# v3 typed entry point — typed-emission.md §2.2.
expand = "expand_block_typed"
validate = "validate_block"
get_keywords = "get_keywords"

[handles]
# Only mcp is a top-level block the compiler expands directly.
# Sub-blocks (tool, resource, prompt, params, args) are nested inside mcp and
# must NOT be listed here — if they were, the compiler would expand them before
# calling expand_block_typed, stripping all sub-block headers from the body.
blocks = ["mcp"]

# Per-block typed-emission declarations (typed-emission.md §2.1).
# version = 3 is required when expansion_version = "3.0.0".
[blocks.mcp]
expand = "expand_block_typed"
version = 3

# Bridge function declarations — MCP-specific functions provided by the runtime.
# String params use (ptr i32, len i32) pairs when expand_strings = true.
#
# Plugin Contracts v2 — foundation/spec/framework/contracts/bridge-host-classes.md §2.
# MCP transports require stdin/stdout/network I/O and live in a long-running
# server process; they never run in a browser. Every bridge is tagged
# hosts=["server"] to match the authoritative registry at
# foundation/spec/platform/function-registry.toml.
[bridge]
functions = [
  { name = "_mcp_stdio_read",   params = [],                   returns = "ptr", description = "Read one newline-delimited JSON-RPC 2.0 message from stdin. Blocks until a full line is available. Returns empty string on EOF.", hosts = ["server"] },
  { name = "_mcp_stdio_write",  params = ["string"],           returns = "i32", description = "Write one JSON-RPC 2.0 message plus newline to stdout and flush. Used by the stdio transport loop.", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_http_serve",   params = ["i32", "string"],    returns = "i32", description = "Start the HTTP+SSE listener on the given port and host (POST /mcp for JSON-RPC, GET /sse). Returns 1 immediately; the listener runs in the background.", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_http_accept",  params = [],                   returns = "ptr", description = "Block until the next POST /mcp request arrives and return its raw JSON-RPC body.", hosts = ["server"] },
  { name = "_mcp_http_respond", params = ["string"],           returns = "i32", description = "Deliver the response body to the client of the most recent _mcp_http_accept. Each accept is followed by exactly one respond (an empty body for notifications).", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_http_header",  params = ["string"],           returns = "ptr", description = "Return the value of the named header (case-insensitive) of the request returned by the most recent _mcp_http_accept; empty string when absent.", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_http_require_key", params = ["string"],       returns = "i32", description = "Require Authorization: Bearer <key> on every MCP HTTP request (apiKey:). The host answers 401 Unauthorized to requests without the matching key; they never reach _mcp_http_accept. Returns 1 on success, 0 for an empty key.", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_sse_send",     params = ["string", "string"], returns = "i32", description = "Send a raw SSE event to the connected client identified by clientId.", expand_strings = true, hosts = ["server"] },
  { name = "_mcp_log",          params = ["string", "string"], returns = "i32", description = "Write [frame.mcp] level: message to stderr only (never pollutes the stdio transport). level is debug, info, warn, or error.", expand_strings = true, hosts = ["server"] },
]

# mcp.log is the one bridge application code calls (mcp.md §13.1); the
# transport bridges are emitted by the plugin only (MCP-X002).
[aliases]
functions = [
  { clean_name = "mcp.log", bridge_name = "_mcp_log" },
]

[language]
# Block-level keywords
blocks = ["mcp"]

# Keywords used within plugin context
keywords = [
  { name = "tool",      description = "Declare an AI-callable tool function inside an mcp: block", context = "block" },
  { name = "resource",  description = "Declare a URI-addressable read-only resource inside an mcp: block", context = "block" },
  { name = "prompt",    description = "Declare a parameterized prompt template inside an mcp: block", context = "block" },
  { name = "params",    description = "Declare tool input parameters (type name or type name = default); read them as params.name", context = "block" },
  { name = "args",      description = "Declare prompt template arguments (type name or type name = default); read them as args.name", context = "block" },
  { name = "transport", description = "Configure the transport: stdio (default) or http: with port/host sub-fields", context = "config" },
  { name = "apiKey",    description = "API key for HTTP transport Bearer authentication — use env.get(\"VAR_NAME\") to read from environment", context = "config" },
  { name = "mimeType",  description = "MIME type hint for resource content (application/json, text/plain, text/markdown, text/csv)", context = "block" },
  { name = "version",   description = "Server version string reported in the initialize handshake", context = "config" },
  { name = "description", description = "Human-readable description sent in capability negotiation", context = "config" },
  { name = "port",      description = "TCP port for HTTP transport", context = "config" },
  { name = "host",      description = "Interface to bind for HTTP transport (e.g. \"0.0.0.0\" for all interfaces)", context = "config" },
]

# Custom types provided by the plugin
types = []

# Built-in functions available inside tool/resource/prompt bodies
functions = [
  { name = "mcpJson",  signature = "mcpJson(value) -> string",                 description = "Serialize value (model, list, number, string, boolean) to compact JSON and return it as an MCP text content block." },
  { name = "mcpText",  signature = "mcpText(message) -> string",               description = "Return a plain-text string as an MCP text content block." },
  { name = "mcpError", signature = "mcpError(message, code: \"CODE\") -> string", description = "Return an MCP error result with isError: true; the optional code is reported in _meta.errorCode. The server continues running." },
  { name = "mcp.log",  signature = "mcp.log(level, message)",                  description = "Write a log line to stderr (never stdout). level is debug, info, warn, or error." },
]

# Auto-completion suggestions
completions = [
  { trigger = "mcp ", insert = "mcp \"${1:server-name}\":\n\tversion: \"1.0.0\"\n\tdescription: \"${2:What this MCP server does}\"\n\ttransport: stdio\n\n\ttool \"${3:tool_name}\":\n\t\tdescription: \"${4:What this tool does}\"\n\t\tparams:\n\t\t\t${5:id}: ${6:integer}\n\t\treturn mcpJson(${7:result})" },
  { trigger = "tool ", insert = "tool \"${1:name}\":\n\t\tdescription: \"${2:What this tool does}\"\n\t\tparams:\n\t\t\t${3:param}: ${4:string}\n\t\treturn mcpJson(${5:result})", context = "mcp" },
  { trigger = "resource ", insert = "resource \"${1:scheme://path}\":\n\t\tdescription: \"${2:What this resource provides}\"\n\t\tmimeType: \"application/json\"\n\t\treturn mcpJson(${3:data})", context = "mcp" },
  { trigger = "prompt ", insert = "prompt \"${1:name}\":\n\t\tdescription: \"${2:What this prompt template does}\"\n\t\targs:\n\t\t\t${3:arg}: ${4:string}\n\t\treturn \"${5:Prompt text about} {{ args.${3} }}\"", context = "mcp" },
]

[paths]
# Folders owned by this plugin - auto-created on plugin import
owns = ["app/mcp"]
auto_create = true
patterns = ["*.cln"]
# Files in app/mcp/ are automatically processed without per-file imports
implicit_import = true

[templates]
# Starter file created when frame.mcp is first added to a project
files = [
  { path = "app/mcp/tools.cln", template = "tools.cln" },
]

[enforcement]
severity = "warn"

required_blocks = [
  { folder = "app/mcp/", block = "mcp", message = "Files in app/mcp/ must contain an mcp: block. Each file declares one MCP server with its tools, resources, and prompts." },
]

block_folder_rules = [
  { block = "mcp", allowed_in = ["app/mcp/"], message = "mcp: blocks must be in app/mcp/" },
]

[ai]
description = "MCP server plugin. Declare AI-callable tools, URI-addressable resources, and prompt templates inside a single mcp: block per file. The plugin generates all JSON-RPC boilerplate, handles the initialize handshake, validates and deserializes params, and dispatches calls. Read inputs as params.name (tools) and args.name (prompts). Return mcpJson() for structured data, mcpText() for plain strings, mcpError() for failures; prompts return the prompt text string. Combine with frame.data for database-backed tools."
constraints = [
  "Each file in app/mcp/ may contain exactly one mcp: block — two mcp: blocks in the same file is a compile error",
  "Tool params without a default value are required — the AI must supply them; params with a default are optional",
  "Read tool inputs as params.name and prompt inputs as args.name — bare names are not defined",
  "Resource bodies must not use the params: block — use a tool if you need parameterized data access",
  "Every tool and resource return must be return mcpJson(...), return mcpText(...) or return mcpError(...); prompts return the prompt text string (or mcpError on failure)",
  "Never call the _mcp_* transport bridges directly — the plugin owns the transport. For diagnostics use mcp.log(level, message); it writes to stderr and never pollutes the stdio JSON-RPC stream",
  "apiKey: is valid only with transport: http: — every request must send Authorization: Bearer <key>; others get 401 Unauthorized. Read the key from the environment (apiKey: env.get(\"MCP_API_KEY\")); if it evaluates to an empty string the HTTP server is not started",
  "Do not print to stdout inside tool/resource/prompt bodies when using stdio transport — it corrupts the JSON-RPC stream",
  "Required params must be declared before optional params in the params: block",
]

[[ai.patterns]]
name = "database-tools"
use_when = "building tools that read or write data from the application database (blog posts, users, orders, etc.)"
anti_pattern = "returning raw SQL or unstructured strings — always return typed model values via mcpJson() so the AI client receives a consistent schema; pair frame.mcp with frame.data in main.cln"
example = "patterns/database-tools.cln"

[[ai.patterns]]
name = "basic-tools"
use_when = "building computation tools, greeting generators, or tools that don't need a database"
anti_pattern = "adding unnecessary database queries just to follow a pattern — keep tool bodies simple when no data persistence is needed"
example = "patterns/basic-tools.cln"

[build]
built_with_compiler = "0.33.176"