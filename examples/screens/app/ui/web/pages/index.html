<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clean UI Screens Example</title>
	<link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
	<h1>Clean UI Screens Example</h1>
	<p>This example places screens on an HTML page. Each screen is a view with its own screen-scoped state.</p>

	<h2>Counter</h2>
	<p>A counter with increment, decrement, and reset buttons.</p>
	<screen name="Counter" client="on"></screen>

	<h2>Todo List</h2>
	<p>A todo list demonstrating text input and state management.</p>
	<screen name="TodoList" client="on"></screen>
</body>
</html>
