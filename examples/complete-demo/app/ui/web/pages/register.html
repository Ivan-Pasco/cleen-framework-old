<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - Clean Framework Demo</title>
	<link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
	<nav class="navbar">
		<a href="/" class="logo">Clean Framework</a>
		<div class="nav-links">
			<a href="/">Home</a>
			<a href="/dashboard">Dashboard</a>
		</div>
	</nav>

	<main class="container">
		<div class="form-container">
			<div class="form-header">
				<h1>Create Account</h1>
				<p>Join us and start building amazing applications</p>
			</div>

			<!-- Posted to POST /register (app/server/api/main.cln), which
			     validates the fields, hashes the password and saves the user. -->
			<form class="form" action="/register" method="POST">
				<div class="form-group">
					<label for="username">Username</label>
					<input type="text" id="username" name="username" minlength="3" maxlength="50" placeholder="Choose a username" required>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="Enter your email" required>
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" id="password" name="password" minlength="8" placeholder="Create a password" required>
				</div>

				<div class="form-group">
					<label for="password_confirm">Confirm Password</label>
					<input type="password" id="password_confirm" name="password_confirm" minlength="8" placeholder="Confirm your password" required>
				</div>

				<button type="submit" class="btn btn-primary btn-block">Create Account</button>
			</form>

			<p class="form-footer">
				Already have an account? <a href="/">Sign in</a>
			</p>
		</div>
	</main>
</body>
</html>
