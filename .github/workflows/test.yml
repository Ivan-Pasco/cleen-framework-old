name: Test Frame Framework

# Runs the framework test suites against the plugins in THIS checkout (the
# committed plugin.wasm files), the latest old-toolchain compiler and the
# latest clean-server:
#   - tests/framework/{runtime,unit,integration,e2e} via run-framework-tests.sh
#   - the dev-capture endpoint shell tests
#   - plugins/*/tests compile checks via test-plugins.sh
#   - every example compiled, booted and requested via smoke-examples.sh
#   - the browser runtime JSON bridge tests (node)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fail-fast gate: block any PR/push containing placeholder tests before we
  # spend runner minutes compiling anything. See tests/CONVENTIONS.md §6a.
  placeholder-guard:
    name: Test placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run placeholder guard
        run: python3 scripts/check-test-placeholders.py

  framework-tests:
    name: Framework tests (real bridge)
    runs-on: ubuntu-latest
    needs: placeholder-guard
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest Clean Language compiler
        run: |
          set -euo pipefail
          # The old compiler lives at Ivan-Pasco/clean-language-compiler-old (the
          # original name now belongs to the new Clean Language project).
          # Resolve the tag ourselves so any resolution failure is loud.
          tag="$(curl -fsSL https://api.github.com/repos/Ivan-Pasco/clean-language-compiler-old/releases/latest | jq -r '.tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Failed to resolve latest compiler tag from GitHub API"
            exit 1
          fi
          ver="${tag#v}"
          echo "Installing Clean Language compiler $ver (from $tag)"
          mkdir -p "$HOME/.cleen/versions/$ver" "$HOME/.cleen/bin"
          curl -fsSL -o "$HOME/.cleen/versions/$ver/cln" \
            "https://github.com/Ivan-Pasco/clean-language-compiler-old/releases/download/$tag/cln-linux-x86_64"
          chmod +x "$HOME/.cleen/versions/$ver/cln"
          ln -sf "$HOME/.cleen/versions/$ver/cln" "$HOME/.cleen/bin/cln"
          echo "$ver" > "$HOME/.cleen/active-version"
          "$HOME/.cleen/bin/cln" --version

      - name: Install latest clean-server
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cleen/bin"
          curl -fsSL -o /tmp/clean-server.tar.gz \
            https://github.com/Ivan-Pasco/clean-server-old/releases/latest/download/clean-server-linux-x64.tar.gz
          tar -xzf /tmp/clean-server.tar.gz -C "$HOME/.cleen/bin" clean-server
          chmod +x "$HOME/.cleen/bin/clean-server"
          "$HOME/.cleen/bin/clean-server" --version

      - name: Install Frame plugins from this checkout
        # Tests the committed plugin.wasm files, not the latest release (which
        # may still be uploading when a tag push and a main push race).
        run: ./scripts/install-plugins.sh

      - name: Framework suites (runtime, unit, integration, e2e)
        run: ./scripts/run-framework-tests.sh

      - name: Dev-capture endpoint tests
        run: |
          # Each script ends with one PASS:/FAIL: verdict line (a SKIP: line
          # means a prerequisite is missing, which is a failure in CI).
          failed=0
          for t in tests/framework/integration/dev-capture/*-test.sh; do
            out="$(bash "$t" 2>&1)" || true
            echo "$out"
            echo "$out" | tail -1 | grep -q '^PASS:' || failed=1
          done
          exit "$failed"

      - name: Plugin compile checks (plugins/*/tests)
        run: ./scripts/test-plugins.sh

      - name: Canvas runtime tests (node)
        run: |
          node plugins/frame.canvas/runtime/tests/runtime-bridges.test.mjs
          node plugins/frame.canvas/runtime/tests/scene-runtime.test.mjs
          node plugins/frame.canvas/runtime/tests/frame-pipeline.test.mjs
          node plugins/frame.canvas/runtime/tests/scene-stack.test.mjs
          node plugins/frame.canvas/runtime/tests/page-bridge.test.mjs

      - name: frame.ui runtime tests (node)
        run: |
          node plugins/frame.ui/scripts/test_time_bridges.mjs
          node plugins/frame.ui/scripts/test_loader_runtime.mjs

      - name: frame.client runtime tests (node)
        run: node plugins/frame.client/runtime/tests/client-runtime.test.mjs

      - name: Example smoke tests (compile, boot, request routes)
        run: ./scripts/smoke-examples.sh

  json-bridge-conformance:
    name: JSON bridge conformance (JSONTestSuite)
    runs-on: ubuntu-latest
    needs: placeholder-guard
    timeout-minutes: 5
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run _json_encode_v2 / _json_decode_v2 unit tests
        working-directory: plugins/frame.ui/scripts
        run: node test_json_v2.mjs

      - name: Run JSONTestSuite conformance harness against _json_decode_v2
        working-directory: plugins/frame.ui/scripts
        run: node test_json_conformance.mjs
